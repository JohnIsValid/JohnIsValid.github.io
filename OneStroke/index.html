<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08120f" />
    <title>一笔画</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="back-link" href="../index.html" aria-label="返回主页">← 返回主页</a>

    <main class="game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">ONE STROKE</p>
          <h1>一笔画</h1>
          <p class="intro">普通点区域需要一笔连接完整；从颜色点起笔时，到达同色点即可保留线路。</p>
        </div>

        <div class="game-controls">
          <span class="current-level" id="currentLevelName">正在读取关卡</span>
          <a href="editor.html">关卡编辑器</a>
          <button type="button" id="resetButton">重置本关</button>
          <button class="primary-button" type="button" id="levelPickerButton">关卡选择</button>
        </div>
      </header>

      <section class="status-panel" aria-live="polite">
        <div>
          <span>连接进度</span>
          <strong id="progressText">0 / 0</strong>
        </div>
        <p id="hint">按住任意亮点开始</p>
      </section>

      <section class="board-shell">
        <div
          class="board"
          id="board"
          role="application"
          aria-label="10乘10一笔画棋盘，按住并拖动经过所有亮点"
        >
          <canvas id="trailCanvas" aria-hidden="true"></canvas>
          <div class="dot-layer" id="dotLayer" aria-hidden="true"></div>

          <div class="completion-card" id="completionCard" aria-hidden="true">
            <span class="completion-mark" aria-hidden="true">✓</span>
            <p>ONE STROKE COMPLETE</p>
            <h2>一笔完成</h2>
            <span class="next-level-note" id="nextLevelNote">即将进入下一关</span>
          </div>
        </div>
      </section>

      <p class="rule-note">颜色线路保留后仍可从颜色端点重新拿起并回退；所有参与点完成才算通关。</p>
    </main>

    <div class="level-picker" id="levelPicker" hidden>
      <section class="level-picker-card" role="dialog" aria-modal="true" aria-labelledby="levelPickerTitle">
        <button class="picker-close" id="closeLevelPickerButton" type="button" aria-label="关闭关卡选择">×</button>
        <p class="eyebrow">LEVEL SELECT</p>
        <h2 id="levelPickerTitle">选择关卡</h2>
        <p class="level-count" id="levelCount">共 0 个关卡</p>
        <div class="level-options" id="levelOptions"></div>
      </section>
    </div>

    <script src="levels.js"></script>
    <script src="game.js"></script>
  </body>
</html>
